<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tài khoản · VisionFace</title><link rel="stylesheet" href="assets/auth.css"></head><body>
<header class="topbar"><a class="brand" href="/">VisionFace Pro</a><nav class="links"><span data-session-name></span><a href="/">Camera</a><a href="/admin.html" data-admin-only hidden>Quản trị</a><button data-logout>Đăng xuất</button></nav></header>
<main class="container" style="max-width:650px"><div class="card"><div class="eyebrow">Tài khoản cá nhân</div><h1>Đổi mật khẩu</h1><p id="passwordNotice" class="muted">Sau khi đổi mật khẩu, bạn sẽ đăng nhập lại. Các phiên đăng nhập cũ sẽ được thu hồi.</p><form id="passwordForm"><label>Mật khẩu hiện tại<input id="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label><label>Mật khẩu mới<input id="newPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>Nhập lại mật khẩu mới<input id="confirmPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button id="savePassword" class="primary">Lưu mật khẩu mới</button></form><p id="passwordMessage" class="message" role="status"></p></div></main>
<script src="assets/session.js"></script><script src="assets/account.js"></script></body></html>
