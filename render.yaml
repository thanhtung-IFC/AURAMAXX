services:
  - type: web
    name: visionface
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: python -u render_start.py
    healthCheckPath: /api/health
    envVars:
      - key: FACE_DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: FACE_COOKIE_SECURE
        value: "true"
      - key: HOST
        value: 0.0.0.0

  - type: web
    name: auramaxx-guide
    runtime: static
    buildCommand: >-
      mkdir -p guide-site-dist/assets/videos &&
      cp guide-site/index.html guide-site-dist/index.html &&
      cp frontend/assets/auramaxx-logo-transparent.webp guide-site-dist/assets/auramaxx-logo-transparent.webp &&
      cp frontend/assets/videos/huong-dan-auramaxx.mp4 guide-site-dist/assets/videos/huong-dan-auramaxx.mp4
    staticPublishPath: ./guide-site-dist
    buildFilter:
      paths:
        - guide-site/index.html
        - frontend/assets/auramaxx-logo-transparent.webp
        - frontend/assets/videos/huong-dan-auramaxx.mp4
        - render.yaml
